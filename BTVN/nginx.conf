events {}
http {
    # Leaky bucket: 10 requests/second/IP, no burst allowance.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    log_format lab '$remote_addr "$request" status=$status rt=$request_time upstream=$upstream_response_time limit=$limit_req_status';
    access_log /dev/stdout lab;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        limit_req zone=api;
        auth_request /_verify;
        auth_request_set $verified_user $upstream_http_x_user_id;
        proxy_set_header X-User-ID $verified_user;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        location = /_verify {
            internal;
            auth_request off;
            proxy_pass http://user:8000/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
        location = /auth/login {
            auth_request off;
            proxy_pass http://user:8000;
        }
        location ~ ^/users(?:/|$) { proxy_pass http://user:8000; }
        location ~ ^/orders(?:/|$) { proxy_pass http://order:8000; }
        location = /dashboard { proxy_pass http://user:8000; }
        location / { return 404; }
    }
}
